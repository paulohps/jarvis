services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
            - '${REVERB_PORT:-8080}:${REVERB_SERVER_PORT:-8080}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
            - mailpit
            - gotenberg
            - evolution-api
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    gotenberg:
        image: 'gotenberg/gotenberg:8'
        ports:
            - '${FORWARD_GOTENBERG_PORT:-3000}:3000'
        networks:
            - sail
    evolution-api:
        image: 'evoapicloud/evolution-api:latest'
        ports:
            - '${FORWARD_EVOLUTION_API_PORT:-8081}:8080'
        environment:
            SERVER_URL: 'http://localhost:${FORWARD_EVOLUTION_API_PORT:-8081}'
            SERVER_PORT: 8080
            AUTHENTICATION_API_KEY: '${EVOLUTION_API_KEY}'
            DATABASE_PROVIDER: postgresql
            DATABASE_CONNECTION_URI: 'postgresql://${DB_USERNAME}:${DB_PASSWORD:-secret}@pgsql:5432/${DB_DATABASE}?schema=evolution_api'
            DATABASE_CONNECTION_CLIENT_NAME: evolution_api
            # Keep the messages and the history handed over on linking, so the
            # reply keyboard's "Sync conversations" can import them again.
            DATABASE_SAVE_DATA_NEW_MESSAGE: 'true'
            DATABASE_SAVE_DATA_HISTORIC: 'true'
            CACHE_REDIS_ENABLED: 'true'
            CACHE_REDIS_URI: 'redis://redis:6379/6'
            CACHE_REDIS_PREFIX_KEY: evolution
            CACHE_LOCAL_ENABLED: 'false'
            WEBHOOK_GLOBAL_ENABLED: 'false'
        volumes:
            - 'sail-evolution:/evolution/instances'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    sail-evolution:
        driver: local
